<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Outreach - PMHNP Billing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { 
            text-align: center; 
            margin-bottom: 10px;
            font-size: 2em;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        .nav {
            text-align: center;
            margin-bottom: 30px;
        }
        .nav a {
            color: #2ed573;
            text-decoration: none;
            margin: 0 15px;
        }
        .nav a:hover { text-decoration: underline; }
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .prospect-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #2ed573;
            margin-bottom: 5px;
        }
        .prospect-info {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 15px;
        }
        .message-box {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
            border-left: 4px solid #2ed573;
        }
        .message-label {
            color: #2ed573;
            font-size: 0.8em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .message-text {
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .copy-btn {
            background: #2ed573;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
        .copy-btn:hover { background: #26b862; }
        .linkedin-btn {
            background: #0077b5;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            margin-left: 10px;
            text-decoration: none;
            display: inline-block;
        }
        .linkedin-btn:hover { background: #005885; }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        .empty-state h2 { margin-bottom: 15px; color: #fff; }
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-left: 10px;
        }
        .status-ready { background: #2ed573; color: #000; }
        .status-sent { background: #888; color: #fff; }
        .last-updated {
            text-align: center;
            color: #666;
            font-size: 0.8em;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✉️ Daily Outreach</h1>
        <p class="subtitle">LinkedIn messages prepared by AI, ready for you to send</p>
        
        <div class="nav">
            <a href="index.html">← Dashboard</a>
            <a href="prospects.html">Prospects</a>
        </div>

        <div id="outreach-content">
            <div class="empty-state">
                <h2>📝 No messages ready yet</h2>
                <p>The Outreach Prep agent runs every weekday at 8am CST.</p>
                <p>It will prepare personalized LinkedIn messages for your top prospects.</p>
                <p style="margin-top: 20px; color: #2ed573;">Next run: Tomorrow 8:00 AM</p>
            </div>
        </div>

        <div class="last-updated" id="lastUpdated"></div>
    </div>

    <script>
        async function loadOutreach() {
            try {
                const response = await fetch('outreach.json');
                if (!response.ok) throw new Error('No outreach data');
                
                const data = await response.json();
                
                if (!data.messages || data.messages.length === 0) {
                    return; // Keep empty state
                }

                let html = '';
                data.messages.forEach((msg, i) => {
                    html += `
                        <div class="card">
                            <div class="prospect-name">
                                ${msg.name}
                                <span class="status-badge ${msg.sent ? 'status-sent' : 'status-ready'}">
                                    ${msg.sent ? 'SENT' : 'READY'}
                                </span>
                            </div>
                            <div class="prospect-info">
                                ${msg.location} • ${msg.specialty || 'PMHNP'} • Score: ${msg.score}/10
                            </div>
                            <div class="message-box">
                                <div class="message-label">LinkedIn Connection Message</div>
                                <div class="message-text" id="message-${i}">${msg.message}</div>
                            </div>
                            <button class="copy-btn" onclick="copyMessage(${i})">📋 Copy Message</button>
                            ${msg.linkedin ? `<a class="linkedin-btn" href="${msg.linkedin}" target="_blank">🔗 Open LinkedIn</a>` : ''}
                        </div>
                    `;
                });

                document.getElementById('outreach-content').innerHTML = html;
                document.getElementById('lastUpdated').textContent = 
                    'Last updated: ' + new Date(data.updatedAt).toLocaleString();

            } catch (error) {
                console.log('No outreach data yet');
            }
        }

        function copyMessage(index) {
            const text = document.getElementById('message-' + index).textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('Message copied! Paste it in LinkedIn.');
            });
        }

        loadOutreach();
    </script>
</body>
</html>
