<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>PMHNP Billing — Layered Depth Preview</title>
  <style>
    html,
    body,
    #preview-frame {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      background: #faf7f0;
    }

    body {
      overflow: hidden;
    }
  </style>
</head>
<body>
  <iframe
    id="preview-frame"
    src="/"
    title="PMHNP Billing layered-depth visual preview"
    sandbox="allow-same-origin allow-scripts allow-popups"
  ></iframe>
  <script>
    (() => {
      const frame = document.getElementById('preview-frame');

      frame.addEventListener('load', () => {
        const previewDocument = frame.contentDocument;
        if (!previewDocument || previewDocument.querySelector('link[data-layered-depth-preview]')) return;

        const stylesheet = previewDocument.createElement('link');
        stylesheet.rel = 'stylesheet';
        stylesheet.href = '/assets/layered-depth.css?v=20261015b';
        stylesheet.dataset.layeredDepthPreview = 'true';
        previewDocument.head.appendChild(stylesheet);

        previewDocument.querySelectorAll('form').forEach((form) => {
          form.addEventListener('submit', (event) => event.preventDefault());
        });
      });
    })();
  </script>
</body>
</html>
