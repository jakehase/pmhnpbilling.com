name: Notify IndexNow after Pages deployment

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - ".github/workflows/indexnow.yml"
      - "scripts/indexnow-config.json"
      - "scripts/submit-indexnow.py"

permissions:
  actions: read
  contents: read

concurrency:
  group: indexnow-main
  cancel-in-progress: true

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Wait for the matching Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            runs="$(curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=20")"
            state="$(jq -r '[.workflow_runs[] | select(.name == "pages build and deployment")][0] | if . == null then "not_found" else (.status + ":" + (.conclusion // "pending")) end' <<<"$runs")"
            case "$state" in
              completed:success)
                echo "Pages deployment succeeded for ${HEAD_SHA}."
                exit 0
                ;;
              completed:*)
                echo "Pages deployment did not succeed: ${state}" >&2
                exit 1
                ;;
              *)
                echo "Waiting for Pages deployment (${attempt}/40): ${state}"
                sleep 10
                ;;
            esac
          done
          echo "Timed out waiting for the Pages deployment." >&2
          exit 1

      - name: Notify IndexNow about changed indexable pages
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(--head "$HEAD_SHA" --submit)
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            args+=(--base "$BASE_SHA")
          fi
          python3 scripts/submit-indexnow.py "${args[@]}"
